services:
  - type: web
    name: dopamine-loop
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      # 배포 주소가 정해지면 지정 (예: https://dopamine-loop.onrender.com). 같은 호스트 접속은 지정하지 않아도 허용된다.
      - key: ALLOWED_ORIGIN
        sync: false
